name: Check
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run doctor
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check -p perpetual-desktop --locked
      - run: cargo test -p perpetual-desktop --test persistence --locked
      - run: cargo test -p am-proto -p am-db -p am-vcs --locked
      - run: cargo test -p am-core --lib --locked
      - run: cargo test -p am-daemon --test roundtrip --locked
      - name: Build Windows installer
        run: npx tauri build --ci --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo check -p perpetual-desktop --locked
      - run: cargo test -p am-core --lib --locked
      - run: cargo test -p am-vcs -p am-proto --locked
      - name: Build universal macOS disk image
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build --ci --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    # Build on the oldest supported Ubuntu to keep the glibc requirement low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev curl wget file patchelf libfuse2 dbus xdg-utils
      - run: npm ci
      - run: npm run doctor
      - run: npm test
      - run: npm run build
      - run: cargo check -p perpetual-desktop --locked
      - run: cargo test -p perpetual-desktop --test persistence --locked
      - run: cargo test -p am-core --lib --locked
      - run: cargo test -p am-proto -p am-db -p am-vcs --locked
      - run: cargo test -p am-daemon --test roundtrip --locked
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
