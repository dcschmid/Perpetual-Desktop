name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Azure Trusted Signing. Unset means an unsigned build.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2

      - name: Check the version matches the tag
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = ((Get-Content src-tauri/Cargo.toml -Raw) -split '\[build-dependencies\]')[0]
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value

          if ("v$version" -ne $env:TAG -or $package -ne $version -or $cargoVersion -ne $version) {
            throw "Tag $env:TAG, tauri.conf.json $version, package.json $package, and src-tauri/Cargo.toml $cargoVersion must match."
          }

      - run: npm ci
      - run: npm test
      - run: cargo test -p am-core --lib provider_accounts --locked

      - name: Configure code signing
        id: signing
        shell: pwsh
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:SIGNING_ACCOUNT) {
            Write-Host "::warning::Windows signing is not configured; the installer will be unsigned."
            "signed=false" >> $env:GITHUB_OUTPUT
            return
          }
          cargo install trusted-signing-cli --locked
          $command = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d Perpetual %1"
          @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8 src-tauri/tauri.signing.json
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.signed }}" -eq "true") {
            npx tauri build --ci --config src-tauri/tauri.signing.json
          } else {
            npx tauri build --ci
          }

      - name: Verify signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = @("target/release/perpetual-desktop.exe") + (Get-ChildItem target/release/bundle/nsis -Filter *.exe).FullName
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.StatusMessage)" }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      # Developer ID signing and notarization. Unset means an unsigned build.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - name: Check signing
        id: signing
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS signing is not configured; the app will be ad-hoc signed and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        run: |
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            # Ad-hoc signing lets Apple silicon run the app; it isn't notarized.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
          fi
          npx tauri build --ci --target universal-apple-darwin

      - name: Verify the signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev curl wget file patchelf libfuse2 dbus xdg-utils
      - run: npm ci
      - run: npm run doctor
      - run: npm test
      - run: cargo test -p am-core --lib --locked
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          {
            echo "## Install"
            echo
            echo "- **Windows:** run the \`.exe\` installer. It installs for your account only and doesn't need administrator rights."
            echo "- **macOS:** open the \`.dmg\` and drag Perpetual to Applications."
            echo "- **Linux x86_64:** on Debian/Ubuntu/Mint run \`sudo apt install ./Perpetual_*_amd64.deb\`. For other distributions, make the \`.AppImage\` executable with \`chmod +x Perpetual_*.AppImage\` and run it. Requires Ubuntu 22.04 / Debian 12 or newer, or a comparable glibc-based distribution. AppImage may need FUSE 2; alternatively run with \`--appimage-extract-and-run\`."
            echo
            echo "Perpetual needs the [Codex CLI](https://developers.openai.com/codex/cli) and/or [Claude Code](https://docs.anthropic.com/en/docs/claude-code/setup)."
            echo
            echo "## Verify your download"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Windows: \`Get-FileHash <file> -Algorithm SHA256\`. macOS: \`shasum -a 256 <file>\`. Linux: \`sha256sum <file>\`."
            echo "To confirm a file was built from this repository: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            if [ "$WINDOWS_SIGNED" != "true" ] || [ "$MACOS_SIGNED" != "true" ]; then
              echo
              echo "> [!NOTE]"
              [ "$WINDOWS_SIGNED" != "true" ] && echo "> The Windows installer isn't code-signed, so SmartScreen may ask you to confirm before running it."
              [ "$MACOS_SIGNED" != "true" ] && echo "> The macOS app isn't notarized. After trying to open it, go to **System Settings → Privacy & Security → Open Anyway**. See [Apple's instructions](https://support.apple.com/en-us/102445)."
            fi
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing.json)" != "true" ]; then
              echo "::error::This tag is already published. Use a new version; published binaries and checksums are immutable."
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.exe dist/*.dmg dist/*.deb dist/*.AppImage dist/SHA256SUMS.txt
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Perpetual ${TAG#v}" --notes-file notes.md --generate-notes \
              dist/*.exe dist/*.dmg dist/*.deb dist/*.AppImage dist/SHA256SUMS.txt
          fi
